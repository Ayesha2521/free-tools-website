<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator — Toolbox</title>
<meta name="description" content="Generate strong, random passwords locally in your browser. Free, no tracking.">
<link rel="stylesheet" href="../assets/css/style.css">
<style>:root{ --accent: var(--bin-password); }</style>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-SJSGZB5MN9"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-SJSGZB5MN9');
</script>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="logo" href="../index.html"><span class="logo-mark" aria-hidden="true"></span>Toolbox</a>
    <nav class="site-nav" aria-label="Primary"><a href="../index.html#tools">All tools</a></nav>
  </div>
</header>

<main>
  <section class="wrap tool-hero">
    <a class="back-link" href="../index.html">&larr; Back to the board</a>
    <p class="bin-tag" style="margin-top:14px;">Bin 06 &middot; Security</p>
    <h1 class="display display--sm">Password Generator</h1>
    <p class="lede">Random, strong passwords generated locally using your browser's cryptographic random source — never sent anywhere.</p>
  </section>

  <section class="wrap tool-body">
    <div class="panel" style="max-width:620px;">
      <div class="field">
        <label for="pwOutput">Your password</label>
        <div class="pw-output">
          <input type="text" id="pwOutput" readonly value="">
          <button type="button" id="copyBtn" title="Copy" aria-label="Copy password">
            <svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
          </button>
          <button type="button" id="regenBtn" title="Generate new" aria-label="Generate new password">
            <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-3-6.3M20 4v5h-5"/></svg>
          </button>
        </div>
        <div class="strength-meter">
          <div class="strength-bar"><div id="strengthFill"></div></div>
          <p class="strength-label" id="strengthLabel">—</p>
        </div>
      </div>

      <div class="field">
        <label for="lengthRange">Length <span id="lengthValue">16</span> characters</label>
        <input type="range" id="lengthRange" min="6" max="48" value="16">
      </div>

      <div class="field-row">
        <label class="checkbox"><input type="checkbox" id="optUpper" checked> Uppercase (A–Z)</label>
        <label class="checkbox"><input type="checkbox" id="optLower" checked> Lowercase (a–z)</label>
      </div>
      <div class="field-row" style="margin-top:10px;">
        <label class="checkbox"><input type="checkbox" id="optNumbers" checked> Numbers (0–9)</label>
        <label class="checkbox"><input type="checkbox" id="optSymbols" checked> Symbols (!@#$…)</label>
      </div>
      <div class="field-row" style="margin-top:10px;">
        <label class="checkbox"><input type="checkbox" id="optAmbiguous"> Exclude look-alike characters (l 1 I O 0)</label>
      </div>

      <button class="btn btn--accent" id="generateBtn" style="width:100%;margin-top:18px;">Generate password</button>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap"><p>Toolbox &middot; Password Generator runs entirely in your browser using the Web Crypto API.</p></div>
</footer>

<script src="../assets/js/password-generator.js" defer></script>
</body>
</html>
